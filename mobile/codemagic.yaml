# iOS build of the HC app on Codemagic (macOS runners) — the Windows workstation cannot build iOS.
# 1) Push this repo (or the mobile/ folder) to GitHub and connect it in Codemagic.
# 2) Add the App Store Connect integration (API key) and an iOS distribution certificate + provisioning profile
#    for the bundle id below (Automatic code signing in Codemagic handles both).
# 3) Run the workflow: it produces an .ipa for TestFlight / the App Store.
workflows:
  ios-release:
    name: HC iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.impactv.hc
      vars:
        BUNDLE_ID: sa.impactv.hc
        API_BASE: https://hc.impactv.sa/api/v1
    scripts:
      - name: Flutter packages
        script: |
          cd mobile
          flutter pub get
      - name: Set bundle id and display name
        script: |
          cd mobile/ios
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" Runner.xcodeproj/project.pbxproj
      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release --dart-define=API_BASE=$API_BASE --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  # Build check only: Codemagic has no company keystore, so this APK is debug-signed and must NOT be published.
  # Published APKs are built locally with android/key.properties (deploy/build.py verifies the signer).
  android-release:
    name: HC Android release
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        API_BASE: https://hc.impactv.sa/api/v1
    scripts:
      - name: Build APK
        script: |
          cd mobile
          flutter pub get
          flutter build apk --release --dart-define=API_BASE=$API_BASE
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
