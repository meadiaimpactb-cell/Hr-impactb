name: hc_mobile
description: HC — Human Capital Management (Impact Valley Capital Group) employee app.
publish_to: 'none'
version: 1.1.3+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  intl: ^0.20.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
